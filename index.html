<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeff & Leah's Wedding</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #777777;
      --accent-color: #8c7b6d;
      --line-color: #ece8e3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #eae7e2;
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--bg-color);
      min-height: 100vh;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
      position: relative;
      padding-bottom: 70px;
    }

    /* Language Switcher */
    .lang-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(252, 251, 250, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: flex-end;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line-color);
    }
    .lang-btn {
      border: 1px solid var(--accent-color);
      background: transparent;
      color: var(--accent-color);
      padding: 3px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
      margin-left: 6px;
    }
    .lang-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Content Visibility by Language */
    body.lang-ko .en { display: none !important; }
    body.lang-en .ko { display: none !important; }

    /* Sections */
    section {
      padding: 40px 24px;
      text-align: center;
      border-bottom: 1px solid var(--line-color);
    }
    .serif {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 16px;
    }

    /* Hero Section */
    .hero {
      padding: 30px 20px;
    }
    .hero-img-wrap {
      width: 100%;
      height: 520px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #dfdad3;
    }
    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }
    .hero-names {
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-names.ko {
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .hero-names.en {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .hero-date {
      color: var(--text-sub);
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* Greeting Section */
    .greeting-text {
      color: var(--text-sub);
      font-size: 14.5px;
      line-height: 2;
    }

    /* Profile Section */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--line-color);
      border-radius: 8px;
      padding: 16px 22px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .profile-role {
      font-size: 13px;
      color: var(--accent-color);
      font-weight: 500;
    }
    .profile-name {
      font-weight: 500;
      font-size: 15.5px;
    }

    /* Timeline Section */
    .timeline {
      text-align: left;
      margin: 20px auto 0;
      max-width: 300px;
    }
    .timeline-item {
      display: flex;
      margin-bottom: 18px;
      position: relative;
    }
    .timeline-time {
      width: 80px;
      font-weight: 500;
      color: var(--accent-color);
      font-size: 13px;
    }
    .timeline-desc {
      flex: 1;
      font-size: 14px;
      color: var(--text-main);
    }

    /* Map & Location */
    .map-box {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      margin: 16px 0;
      border: 1px solid var(--line-color);
    }
    .btn-action {
      display: inline-block;
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      background: var(--accent-color);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-top: 10px;
      border: none;
      cursor: pointer;
    }

    /* Accounts */
    .acc-item {
      background: var(--card-bg);
      border: 1px solid var(--line-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
    }
    .acc-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .acc-details {
      font-size: 13px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-copy {
      background: #f1ede8;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-main);
    }

    /* Toast Alert */
    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      text-align: center;
      border-radius: 20px;
      padding: 10px 16px;
      position: fixed;
      z-index: 999;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
    }
    #toast.show { visibility: visible; }
  </style>
</head>
<body class="lang-ko">

<div class="wrapper">
  <!-- Language Toggle Sticky Bar -->
  <div class="lang-bar">
    <button class="lang-btn active" id="btn-ko" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-img-wrap">
      <img 
        id="hero-photo" 
        src="KakaoTalk_Photo_2026-10-16-10-04-08.jpg" 
        alt="Jeff & Leah Wedding Snapshot"
        onerror="resolvePhotoError(this)"
      >
    </div>
    <div class="section-title serif">Wedding Invitation</div>
    <div class="hero-names ko">제프 앤더슨 &amp; 장혜원</div>
    <div class="hero-names serif en">Jeff Anderson &amp; Leah Hyewon Jang</div>
    <div class="hero-date">19/Feb/2027 FRI 12:30 PM</div>
  </section>

  <!-- Greeting Section -->
  <section>
    <div class="section-title serif">Invitation</div>
    <div class="greeting-text ko">
      서로 다른 길을 걸어오던 두 사람이<br>
      이제 사랑과 신뢰로 하나의 길을 함께 걸어가려 합니다.<br><br>
      애들레이드의 눈부신 여름날,<br>
      저희의 새로운 시작을 함께 축복해 주시면<br>
      더없는 기쁨으로 간직하겠습니다.
