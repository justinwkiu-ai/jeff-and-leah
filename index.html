  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #777777;
      --accent-color: #8c7b6d;
      --line-color: #ece8e3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #eae7e2;
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--bg-color);
      min-height: 100vh;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
      position: relative;
      padding-bottom: 70px;
    }

    /* Language Switcher */
    .lang-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(252, 251, 250, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: flex-end;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line-color);
    }
    .lang-btn {
      border: 1px solid var(--accent-color);
      background: transparent;
      color: var(--accent-color);
      padding: 3px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
      margin-left: 6px;
    }
    .lang-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Content Visibility by Language */
    body.lang-ko .en { display: none !important; }
    body.lang-en .ko { display: none !important; }

    /* Sections */
    section {
      padding: 40px 24px;
      text-align: center;
      border-bottom: 1px solid var(--line-color);
    }
    .serif {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 16px;
    }

    /* Hero Section with Bottom Gradient Fade */
    .hero {
      padding: 20px 20px 40px;
    }
    .hero-top-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-style: italic;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 14px;
    }
    .hero-img-wrap {
      width: calc(100% + 40px);
      margin-left: -20px;
      height: 540px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--bg-color);
      position: relative;
    }
    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }
    .hero-img-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 45%;
      background: linear-gradient(
        to bottom,
        rgba(252, 251, 250, 0) 0%,
        rgba(252, 251, 250, 0.35) 45%,
        rgba(252, 251, 250, 0.85) 80%,
        #fcfbfa 100%
      );
      pointer-events: none;
    }
    .hero-names {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-date {
      color: var(--text-sub);
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* Greeting Section */
    .greeting-text {
      color: var(--text-sub);
      font-size: 14.5px;
      line-height: 2;
    }

    /* Profile Section */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--line-color);
      border-radius: 8px;
      padding: 16px 22px;
      margin: 8px 0;
      display: flex;
